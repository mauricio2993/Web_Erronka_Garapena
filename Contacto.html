<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto</title>

<!-- Estilo limpio tipo W3Schools -->
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background-color: #f9f9f9;
  color: #333;
}

.contact-section {
  text-align: center;
  padding: 60px 20px;
  background-color: white;
}

.contact-section h1 {
  font-size: 36px;
  margin-bottom: 50px;
  color: #111;
}

.contact-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 60px;
  max-width: 1000px;
  margin: auto;
}

.contact-item {
  text-align: center;
  width: 260px;
}

.contact-item i {
  font-size: 40px;
  color: #0b5394;
  margin-bottom: 10px;
}

.contact-item h3 {
  margin: 10px 0 5px;
  font-size: 18px;
}

.contact-item a, .contact-item p {
  color: #333;
  text-decoration: none;
  font-size: 16px;
}

.contact-item a:hover {
  color: #0b5394;
  text-decoration: underline;
}

/* Íconos de Font Awesome */

</style>
</head>

<body>

<!-- Sección de contacto -->
<section class="contact-section">
  <h1>¡Contacta con nosotros!</h1>

  <div class="contact-container">

    <div class="contact-item">
      <i class="fa-solid fa-envelope"></i>
      <h3>Email</h3>
      <a href="mailto:bengoa@bengoa.info">bengoa@bengoa.info</a>
    </div>

    <div class="contact-item">
      <i class="fa-solid fa-phone"></i>
      <h3>Teléfono</h3>
      <p>943 368 649</p>
    </div>

    <div class="contact-item">
      <i class="fa-solid fa-location-dot"></i>
      <h3>Dirección</h3>
      <a href="https://maps.google.com/?q=Avenida+de+Recalde+1,+Local+11,+20018,+Donostia,+Gipuzkoa" target="_blank">
        Avenida de Recalde 1, Local 11, 20018<br>
        Donostia - San Sebastián, Gipuzkoa
      </a>
    </div>

  </div>
</section>

</body>
</html>
